	<style>
	
.image-section {
    width: 100%;
    margin: 40px 0;
}

.image-container {
    display: flex;
    flex-direction: row;
    flex-wrap: nowrap;
    justify-content: center;
    align-items: center;
    gap: 0px;
    width: 100%;
}

/* Dog image */
.image-container .wiggle {
    display: block;
    width: 350px;
    height: auto;
    max-width: 60%;
    flex: 0 1 350px;
}

/* Tennis ball image */
.image-container .float {
    display: block;
    width: 100px;
    height: auto;
    max-width: 25%;
    flex: 0 1 100px;
    position: relative;
    top: -180px;
    animation: floating 2s ease-in-out infinite;
}

/* Dog wiggles on hover */
.image-container .wiggle:hover {
    animation: wiggle 0.4s ease-in-out infinite;
}

@keyframes wiggle {
    0%, 100% { transform: rotate(0deg); }
    25% { transform: rotate(-6deg); }
    75% { transform: rotate(6deg); }
}

/* Tennis ball floats */
@keyframes floating {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-30px); }
}
	</style>
	
	<style>
	.blob {
  width: 180px;
  height: 180px;
  background: #8ECED3;
  border-radius: 50%;
  animation: morph 6s ease-in-out infinite;
}

@keyframes morph {
  0%, 100% {
    border-radius: 50% 50% 50% 50%;
  }
  50% {
    border-radius: 30% 70% 60% 40%;
  }
}
	</style>
	
	<style>
	.blob-flex {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  align-items: center;
  gap: 50px;
  padding: 40px;
}

.blob-item {
  width: 220px;
  height: 280px;
  display: flex;
  justify-content: center;
  align-items: center;
}

.blob {
  width: 200px;
  height: 250px;
  object-fit: cover;

  animation: morph 8s ease-in-out infinite,
             float 10s ease-in-out infinite;
}

/* Give each blob a different animation offset */
.blob-two {
  animation-delay: -2s, -3s;
}

.blob-three {
  animation-delay: -4s, -6s;
}


/* Morphing shape */
@keyframes morph {
  0%, 100% {
    border-radius: 60% 40% 35% 65% /
                   55% 35% 65% 45%;
  }

  50% {
    border-radius: 35% 65% 60% 40% /
                   40% 60% 35% 65%;
  }
}

/* Floating movement */
@keyframes float {
  0%, 100% {
    transform: translate(0, 0) rotate(0deg);
  }

  50% {
    transform: translate(15px, -20px) rotate(8deg);
  }
}
	</style>
